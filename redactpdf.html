<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedactPDF — Free PDF Redaction Tool</title>
<meta name="description" content="Free, private PDF redaction tool. Your files never leave your device. No upload, no account, no subscription.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; background: #1a1a1a; color: #eee; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; flex-wrap: wrap; }
#logo { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: 0.05em; margin-right: 8px; }
#logo span { color: #c0392b; }
button { padding: 6px 14px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: #ddd; font-size: 13px; cursor: pointer; }
button:hover { background: #333; }
button:disabled { opacity: 0.35; cursor: not-allowed; }
#btn-download { background: #c0392b; border-color: #c0392b; color: #fff; font-weight: 600; }
#btn-download:hover:not(:disabled) { background: #a93226; }
#btn-download:disabled { background: #2a2a2a; border-color: #444; color: #666; }
#page-info { font-size: 13px; color: #888; margin: 0 4px; }
#canvas-area { flex: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 24px; background: #111; }
#drop-zone { border: 2px dashed #444; border-radius: 10px; padding: 60px 40px; text-align: center; cursor: pointer; color: #888; width: 400px; }
#drop-zone:hover { border-color: #c0392b; color: #eee; }
#canvas-wrapper { position: relative; display: none; box-shadow: 0 4px 30px rgba(0,0,0,0.7); }
#pdf-canvas { display: block; }
#draw-canvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
#status { padding: 6px 16px; font-size: 12px; color: #888; background: #222; border-top: 1px solid #333; flex-shrink: 0; font-family: monospace; }
#overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 99; align-items: center; justify-content: center; flex-direction: column; gap: 14px; }
#overlay.show { display: flex; }
#overlay-box { background: #222; border: 1px solid #444; border-radius: 10px; padding: 32px 48px; text-align: center; }
#prog-bar-wrap { width: 260px; height: 4px; background: #333; border-radius: 2px; margin-top: 12px; overflow: hidden; }
#prog-bar { height: 100%; background: #c0392b; width: 0%; transition: width 0.2s; }
</style>
</head>
<body>

<div id="toolbar">
  <div id="logo">REDACTPDF<span>.</span></div>
  <button id="btn-open">📂 Open PDF</button>
  <input type="file" id="file-input" accept="application/pdf" style="display:none">
  <span style="color:#444">|</span>
  <button id="btn-undo" disabled>↩ Undo</button>
  <button id="btn-clear" disabled>🗑 Clear All</button>
  <span style="color:#444">|</span>
  <button id="btn-prev" disabled>◀ Prev</button>
  <span id="page-info">— / —</span>
  <button id="btn-next" disabled>Next ▶</button>
  <span style="color:#444">|</span>
  <button id="btn-download" disabled>⬇ Download Redacted PDF</button>
</div>

<div id="canvas-area">
  <div id="drop-zone">
    <div style="font-size:40px;margin-bottom:12px">📄</div>
    <div style="font-size:16px;margin-bottom:6px;color:#eee">Drop a PDF here</div>
    <div style="font-size:12px">or click Open PDF above</div>
    <div style="margin-top:20px;font-size:11px;color:#555;line-height:1.8">
      🔒 Your file never leaves your device.<br>
      No upload. No account. 100% private.
    </div>
  </div>
  <div id="canvas-wrapper">
    <canvas id="pdf-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
  </div>
</div>

<div id="status">Open a PDF to begin — files are processed locally and never uploaded anywhere</div>

<div id="overlay">
  <div id="overlay-box">
    <div id="overlay-msg" style="font-size:14px;color:#eee;">Building redacted PDF…</div>
    <div id="prog-bar-wrap"><div id="prog-bar"></div></div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var pdfDoc = null, pageNum = 1, scale = 1.5;
var rawBytes = null, fileName = 'doc.pdf';
var boxes = {};
var drawing = false, sx = 0, sy = 0;

var pdfCanvas  = document.getElementById('pdf-canvas');
var pdfCtx     = pdfCanvas.getContext('2d');
var drawCanvas = document.getElementById('draw-canvas');
var drawCtx    = drawCanvas.getContext('2d');

function setStatus(msg) { document.getElementById('status').textContent = msg; }

function updateButtons() {
  var total = Object.values(boxes).reduce(function(s,a){return s+a.length;},0);
  document.getElementById('btn-download').disabled = total === 0;
  document.getElementById('btn-undo').disabled = !(boxes[pageNum] && boxes[pageNum].length > 0);
  document.getElementById('btn-clear').disabled = total === 0;
}

function redraw() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  (boxes[pageNum] || []).forEach(function(b) {
    drawCtx.fillStyle = '#000';
    drawCtx.fillRect(b.x, b.y, b.w, b.h);
  });
  updateButtons();
}

async function renderPage(n) {
  var page = await pdfDoc.getPage(n);
  var vp = page.getViewport({ scale: scale });
  pdfCanvas.width = drawCanvas.width = vp.width;
  pdfCanvas.height = drawCanvas.height = vp.height;
  var wrapper = document.getElementById('canvas-wrapper');
  wrapper.style.width  = vp.width  + 'px';
  wrapper.style.height = vp.height + 'px';
  await page.render({ canvasContext: pdfCtx, viewport: vp }).promise;
  document.getElementById('page-info').textContent = n + ' / ' + pdfDoc.numPages;
  redraw();
}

async function loadPDF(bytes, name) {
  rawBytes = bytes; fileName = name;
  pdfDoc = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  var sizeMB = (bytes.length / 1024 / 1024).toFixed(1);
  boxes = {}; pageNum = 1;
  document.getElementById('drop-zone').style.display = 'none';
  document.getElementById('canvas-wrapper').style.display = 'block';
  document.getElementById('btn-prev').disabled = false;
  document.getElementById('btn-next').disabled = false;
  await renderPage(1);
  if (pdfDoc.numPages > 50 || bytes.length > 20 * 1024 * 1024) {
    setStatus('⚠️ Large document (' + pdfDoc.numPages + ' pages, ' + sizeMB + ' MB) — processing may be slow on older devices.');
  } else {
    setStatus(name + ' — ' + pdfDoc.numPages + ' page(s). Draw boxes to redact. Text is permanently destroyed on download.');
  }
}

document.getElementById('btn-open').onclick = function() { document.getElementById('file-input').click(); };
document.getElementById('file-input').onchange = async function(e) {
  var f = e.target.files[0]; if (!f) return;
  await loadPDF(new Uint8Array(await f.arrayBuffer()), f.name);
  e.target.value = '';
};

var dz = document.getElementById('drop-zone');
dz.onclick     = function() { document.getElementById('file-input').click(); };
dz.ondragover  = function(e) { e.preventDefault(); dz.style.borderColor = '#c0392b'; };
dz.ondragleave = function()  { dz.style.borderColor = '#444'; };
dz.ondrop      = async function(e) {
  e.preventDefault(); dz.style.borderColor = '#444';
  var f = e.dataTransfer.files[0];
  if (f && f.type === 'application/pdf') await loadPDF(new Uint8Array(await f.arrayBuffer()), f.name);
};

document.getElementById('btn-prev').onclick  = async function() { if (pageNum > 1) { pageNum--; await renderPage(pageNum); } };
document.getElementById('btn-next').onclick  = async function() { if (pdfDoc && pageNum < pdfDoc.numPages) { pageNum++; await renderPage(pageNum); } };
document.getElementById('btn-undo').onclick  = function() { if (boxes[pageNum] && boxes[pageNum].length) { boxes[pageNum].pop(); redraw(); } };
document.getElementById('btn-clear').onclick = function() { boxes = {}; redraw(); };

drawCanvas.addEventListener('mousedown', function(e) {
  var r = drawCanvas.getBoundingClientRect();
  sx = e.clientX - r.left; sy = e.clientY - r.top; drawing = true;
});
drawCanvas.addEventListener('mousemove', function(e) {
  if (!drawing) return;
  var r = drawCanvas.getBoundingClientRect();
  var cx = e.clientX - r.left, cy = e.clientY - r.top;
  redraw();
  drawCtx.save();
  drawCtx.strokeStyle = 'rgba(192,57,43,0.9)';
  drawCtx.lineWidth = 1.5;
  drawCtx.setLineDash([4, 3]);
  drawCtx.strokeRect(sx, sy, cx - sx, cy - sy);
  drawCtx.fillStyle = 'rgba(192,57,43,0.12)';
  drawCtx.fillRect(sx, sy, cx - sx, cy - sy);
  drawCtx.restore();
});
drawCanvas.addEventListener('mouseup', function(e) {
  if (!drawing) return; drawing = false;
  var r = drawCanvas.getBoundingClientRect();
  var ex = e.clientX - r.left, ey = e.clientY - r.top;
  var w = ex - sx, h = ey - sy;
  if (Math.abs(w) > 4 && Math.abs(h) > 4) {
    if (!boxes[pageNum]) boxes[pageNum] = [];
    boxes[pageNum].push({ x: Math.min(sx,ex), y: Math.min(sy,ey), w: Math.abs(w), h: Math.abs(h) });
  }
  redraw();
});
drawCanvas.addEventListener('mouseleave', function() { if (drawing) { drawing = false; redraw(); } });

function setProgress(pct, msg) {
  document.getElementById('prog-bar').style.width = pct + '%';
  if (msg) document.getElementById('overlay-msg').textContent = msg;
}

document.getElementById('btn-download').onclick = async function() {
  if (!rawBytes || !window.PDFLib) return;
  var overlay = document.getElementById('overlay');
  overlay.classList.add('show');
  setProgress(0, 'Starting…');
  try {
    var newDoc = await PDFLib.PDFDocument.create();
    var totalPages = pdfDoc.numPages;
    var offscreen = document.createElement('canvas');
    var offCtx = offscreen.getContext('2d');

    for (var i = 1; i <= totalPages; i++) {
      setProgress(Math.round((i - 1) / totalPages * 85), 'Rasterising page ' + i + ' of ' + totalPages + '…');
      var page = await pdfDoc.getPage(i);
      var vp = page.getViewport({ scale: 2.0 });
      offscreen.width = vp.width; offscreen.height = vp.height;
      offCtx.fillStyle = '#fff';
      offCtx.fillRect(0, 0, vp.width, vp.height);
      await page.render({ canvasContext: offCtx, viewport: vp }).promise;
      var pageBoxes = boxes[i] || [];
      pageBoxes.forEach(function(b) {
        var ratio = 2.0 / 1.5;
        offCtx.fillStyle = '#000';
        offCtx.fillRect(b.x * ratio, b.y * ratio, b.w * ratio, b.h * ratio);
      });
      var dataUrl  = offscreen.toDataURL('image/png');
      var base64   = dataUrl.split(',')[1];
      var imgBytes = Uint8Array.from(atob(base64), function(c){ return c.charCodeAt(0); });
      var origDoc  = await PDFLib.PDFDocument.load(rawBytes.buffer.slice(0), { ignoreEncryption: true });
      var origSize = origDoc.getPages()[i - 1].getSize();
      var pngImage = await newDoc.embedPng(imgBytes);
      var newPage  = newDoc.addPage([origSize.width, origSize.height]);
      newPage.drawImage(pngImage, { x: 0, y: 0, width: origSize.width, height: origSize.height });
    }

    setProgress(90, 'Saving PDF…');
    var outBytes = await newDoc.save();
    setProgress(100, 'Done!');

    var blob = new Blob([outBytes], { type: 'application/pdf' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href   = url;
    a.download = fileName.replace(/\.pdf$/i, '') + '_redacted.pdf';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 15000);
    setStatus('Saved as ' + a.download + ' — text layer permanently destroyed.');
    setTimeout(function(){ overlay.classList.remove('show'); }, 800);
  } catch(err) {
    overlay.classList.remove('show');
    setStatus('Error: ' + err.message);
    console.error(err);
  }
};
</script>
</body>
</html>
